# hxpilot.com: Nginx rules that do the same job as the .htaccess files (Nginx ignores .htaccess).
# Site layout on the server:
#   /www/wwwroot/hxpilot.com/public      <- web root (contents of pilot-blog/)
#   /www/wwwroot/hxpilot.com/blog-data   <- private data, created by the admin on first visit, never served
# In 宝塔: 网站 > hxpilot.com > 配置文件, paste this block inside the server { } after the root line,
# and remove the panel's default "location ~ \.php$" include line (include enable-php-xx.conf) so only
# the three PHP entry points below can run. Replace 83 with the PHP version you installed if different.

client_max_body_size 20m;
index index.html;
charset utf-8;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# dotfiles, notes, data, templates
location ~ /\. { deny all; }
location ~* \.(bak|orig|swp|log|lock|md|tpl\.html|json|ini|sh|sql)$ { deny all; }

# code, templates, seed data: never served
location ^~ /app/ { deny all; }

# the only PHP that may run
location = /api/chat.php      { include fastcgi.conf; fastcgi_pass unix:/tmp/php-cgi-83.sock; }
location = /api/subscribe.php { include fastcgi.conf; fastcgi_pass unix:/tmp/php-cgi-83.sock; }
location ^~ /api/ { deny all; }

location = /admin { return 301 /admin/; }
location = /admin/ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    include fastcgi.conf;
    fastcgi_param SCRIPT_FILENAME $document_root/admin/index.php;
    fastcgi_pass unix:/tmp/php-cgi-83.sock;
}
location = /admin/index.php {
    add_header X-Robots-Tag "noindex, nofollow" always;
    include fastcgi.conf;
    fastcgi_pass unix:/tmp/php-cgi-83.sock;
}
location ~ ^/admin/.*\.php$ { deny all; }
location ^~ /admin/ { add_header X-Robots-Tag "noindex, nofollow" always; }

# uploaded images: never executed or rendered as pages
location ^~ /uploads/ {
    location ~* \.(php\d*|phtml|phar|pht|cgi|pl|py|sh|shtml|html?|svg|js)$ { deny all; }
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# post pages: static, no scripts
location ^~ /posts/ {
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# any other .php anywhere: refuse
location ~ \.php$ { deny all; }

location ~* \.html$ { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options "nosniff" always; add_header X-Frame-Options "SAMEORIGIN" always; }
location ~* \.(mp4|webp|jpg|png|woff2)$ { expires 30d; access_log off; }
