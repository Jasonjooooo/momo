<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>信用卡管家</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#2563eb">
<style>
:root{--bg:#f3f4f8;--card:#fff;--text:#161a23;--sub:#6b7280;--line:#e6e8ee;--pri:#2563eb;--good:#059669;--bad:#dc2626;--warn:#d97706;--shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.05);--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--neg:#e34948}
@media (prefers-color-scheme:dark){:root{--bg:#0e1015;--card:#181b22;--text:#e8eaef;--sub:#98a1b2;--line:#272c37;--pri:#6aa5ff;--good:#34d399;--bad:#f87171;--warn:#fbbf24;--shadow:0 1px 2px rgba(0,0,0,.4);--s1:#3987e5;--s2:#d95926;--s3:#199e70;--neg:#e66767}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:6;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0;letter-spacing:.2px}
.hb{display:flex;gap:6px}
.ib{min-width:36px;height:36px;padding:0 8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.ib:hover{border-color:var(--pri)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;padding:6px 2px;cursor:pointer;border-radius:10px}
nav button .ic{font-size:20px;line-height:1.2}
nav button.on{color:var(--pri);font-weight:600}
main{max-width:980px;margin:0 auto;padding:16px 16px 92px}
@media (min-width:900px){
  nav{top:57px;bottom:0;right:auto;width:196px;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--line);padding:16px 12px;gap:4px;backdrop-filter:none;background:var(--card)}
  nav button{flex:none;flex-direction:row;gap:10px;font-size:15px;padding:10px 12px;justify-content:flex-start}
  nav button .ic{font-size:18px}
  nav button.on{background:color-mix(in srgb,var(--pri) 12%,transparent)}
  main{max-width:none;margin:0 0 0 196px;padding:24px 32px 40px}
  #app{max-width:980px}
}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
.grid .box{margin-bottom:0}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.box>b:first-child{font-size:16px}
.stat .n{font-size:22px;font-weight:700;margin-top:2px}.stat .l{color:var(--sub);font-size:12.5px}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.sub{color:var(--sub);font-size:13px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--sub);font-weight:500;font-size:12.5px}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}.tw th,.tw td{white-space:nowrap}
button.b,.b{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-size:14px;cursor:pointer;font-weight:500}
@media (prefers-color-scheme:dark){button.b,.b{color:#0b1220}}
button.b:active{transform:scale(.97)}
button.g,.b.g{background:none;color:var(--pri);border:1px solid var(--line)}
button.d{background:none;color:var(--bad);border:0;padding:4px 8px;cursor:pointer}
button.e{background:none;color:var(--pri);border:0;padding:4px 8px;cursor:pointer}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
label{display:flex;flex-direction:column;font-size:12.5px;color:var(--sub);gap:5px}
input,select{padding:10px;min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-size:15px;width:100%}
input:focus,select:focus{outline:2px solid color-mix(in srgb,var(--pri) 45%,transparent);border-color:var(--pri)}
.full{grid-column:1/-1}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--pri);border-radius:4px}
.rule{display:flex;gap:6px;margin-bottom:6px}
.rule input:first-child{flex:2}.rule input:nth-child(2){flex:1}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;margin:2px 4px 2px 0}
.empty{text-align:center;color:var(--sub);padding:24px}
/* 卡面 */
.face{position:relative;aspect-ratio:1.586;border-radius:18px;color:#fff;padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;background-size:cover;background-position:center;box-shadow:0 10px 24px rgba(0,0,0,.22)}
.face::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 88% -8%,rgba(255,255,255,.3),transparent 55%),radial-gradient(circle at -10% 110%,rgba(255,255,255,.12),transparent 50%)}
.face>*{position:relative}
.face .t{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;font-weight:700;font-size:16px;text-shadow:0 1px 3px rgba(0,0,0,.25)}
.face .chipic{width:36px;height:27px;border-radius:6px;background:linear-gradient(135deg,#f6dd8b,#c79a1f);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.face .num{font-size:17px;letter-spacing:.14em;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.face .bt{display:flex;justify-content:space-between;align-items:flex-end;font-size:12px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.face.img::before{background:linear-gradient(transparent 55%,rgba(0,0,0,.55))}
.face.img{justify-content:flex-end}
.pill{background:rgba(0,0,0,.45);padding:3px 10px;border-radius:999px;backdrop-filter:blur(4px)}
.face .cur{font-size:11px;border:1px solid rgba(255,255,255,.7);border-radius:6px;padding:0 6px}
.faces{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.cd .box{margin:-26px 6px 0;padding-top:34px;position:relative;z-index:0;border-radius:0 0 16px 16px}
.cd .face{position:relative;z-index:1}
.wall{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 14px;margin-bottom:6px}
.wall .item{flex:0 0 min(270px,78%);scroll-snap-align:start}
.wall .cap{display:flex;justify-content:space-between;font-size:13px;margin-top:8px;padding:0 4px}
.dot{display:inline-block;width:16px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px;background-size:cover;background-position:center}
.sw{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.swb{width:30px;height:30px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.swb.on{box-shadow:0 0 0 2px var(--pri)}
#prev{max-width:340px}
/* 图表 */
svg.ch{width:100%;height:auto;display:block;overflow:visible}
svg.ch text{fill:var(--sub);font-size:15px}
svg.ch .v{fill:var(--text)}
svg.ch .grid{stroke:var(--line);stroke-width:1}
svg.ch rect[data-tip]{cursor:pointer}
.leg{display:flex;gap:14px;font-size:13px;margin:4px 0 8px;flex-wrap:wrap}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
#tip{position:fixed;z-index:9;pointer-events:none;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.18);display:none;white-space:pre-line}
details summary{cursor:pointer;color:var(--sub);font-size:13px;margin-top:8px}
.disc{margin:18px 4px 0;text-align:center;font-size:12px;color:var(--sub)}
.disc a{color:var(--sub)}
ul.help{padding-left:18px;margin:8px 0 0;line-height:1.8;font-size:14px}
</style>
</head>
<body>
<header><h1>💳 信用卡管家</h1>
<div class="hb"><button class="ib" id="sync" title="同步到服务器">☁️</button><button class="ib" id="bell" title="浏览器通知">🔔</button><button class="ib" id="ics" title="导出日历提醒(.ics)">📅</button><button class="ib" id="aboutbtn" title="使用说明与免责声明">ℹ️</button><button class="ib" id="exp" title="导出备份(JSON)">⬇️</button><label class="ib" title="导入备份(JSON)" style="cursor:pointer">⬆️<input type="file" id="imp" accept=".json" hidden></label></div></header>
<nav id="nav"></nav>
<main id="app"></main>

<script>
const KEY='momo-cards-v1';
const CATS=['餐饮','超市','出行','网购','娱乐','话费水电','其他'];
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CURS={CNY:'¥',USD:'US$',HKD:'HK$',EUR:'€',GBP:'£',JPY:'JP¥'};
const money=(n,cur='CNY')=>{const j=cur==='JPY',d=j?0:2;return (n<0?'-':'')+(CURS[cur]||cur+' ')+Math.abs(Math.round(n*100)/100).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d})};
const fx=cur=>!cur||cur==='CNY'?1:(db.rates&&db.rates[cur])||1;   // 1 单位外币折合多少人民币
const curOpts=sel=>Object.keys(CURS).map(c=>`<option ${c===(sel||'CNY')?'selected':''}>${c}</option>`).join('');
const norm=d=>{d.offers=d.offers||[];d.rates=Object.assign({USD:7.2,HKD:0.92,EUR:7.8,GBP:9.1,JPY:0.048},d.rates||{});return d};
const uid=()=>Math.random().toString(36).slice(2,10);
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const pd=s=>new Date(s+'T00:00:00');
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const diff=s=>Math.round((pd(s)-pd(today()))/864e5);

let db;
try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
db=db&&db.cards?db:{cards:[],txs:[]};
norm(db);
const TOK='momo-token';
const getTok=()=>{try{return localStorage.getItem(TOK)||''}catch(e){return ''}};
const SYNC={off:['☁️','未开启同步,点击设置令牌'],ok:['☁️✓','已同步'],auth:['☁️⚠️','令牌错误'],err:['☁️✕','离线,稍后重试']};
function setSync(k){const b=document.getElementById('sync');if(b){b.textContent=SYNC[k][0];b.title=SYNC[k][1]}}
let pushT;
function pushRemote(){const t=getTok();if(!t)return;clearTimeout(pushT);pushT=setTimeout(async()=>{
  try{const r=await fetch('api/data',{method:'PUT',headers:{'X-Token':t,'Content-Type':'application/json'},body:JSON.stringify(db)});
    if(r.status===409){await pullRemote();return}setSync(r.ok?'ok':r.status===401?'auth':'err')}catch(e){setSync('err')}},600)}
const store=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
const save=()=>{db.updatedAt=Date.now();store();pushRemote()};
async function pullRemote(){const t=getTok();if(!t)return setSync('off');
  try{const r=await fetch('api/data',{headers:{'X-Token':t}});if(r.status===401)return setSync('auth');if(!r.ok)return setSync('err');
    const d=await r.json();
    if(d&&Array.isArray(d.cards)&&(d.updatedAt||0)>(db.updatedAt||0)){db=norm(d);store();render()}
    else if((db.updatedAt||0)>(d&&d.updatedAt||0))pushRemote();
    else if(!(d&&d.updatedAt)&&(db.cards.length||db.offers.length||db.txs.length))save();
    setSync('ok')}catch(e){setSync('err')}}

let matrix='reward',tab='dash',year=new Date().getFullYear(),editCard=null,editOffer=null;
const TABS=[['dash','总览','🏠'],['stats','分析','📈'],['cards','卡片','💳'],['txs','记账','🧾'],['offers','开户奖励','🎁']];

// 返现/积分:rules=[{cat,rate}],rate 为百分比;base 为默认比例;pv 为每1元积分折算价值(元)
function earn(card,tx){
  const r=(card.rules||[]).find(r=>r.cat===tx.cat);
  const rate=+(r?r.rate:card.base)||0;
  return {v:tx.amount*rate/100,rate};
}
// 某卡某年各月收益(已含月封顶和积分折算),返回长度 12 的数组
function cardMonthly(card,y){
  const m=Array(12).fill(0);
  db.txs.filter(t=>t.card===card.id&&t.date.startsWith(y)).forEach(t=>{m[+t.date.slice(5,7)-1]+=earn(card,t).v});
  return m.map(v=>(card.cap>0?Math.min(v,card.cap):v)*(card.pv??1));
}
function cardStats(card,y){
  const txs=db.txs.filter(t=>t.card===card.id&&t.date.startsWith(y));
  const spend=txs.reduce((s,t)=>s+t.amount,0);
  let reward=txs.reduce((s,t)=>s+earn(card,t).v,0);
  if(card.cap>0){ // 按月封顶
    const m={};txs.forEach(t=>{const k=t.date.slice(0,7);m[k]=(m[k]||0)+earn(card,t).v});
    reward=Object.values(m).reduce((s,v)=>s+Math.min(v,card.cap),0);
  }
  reward*= card.pv??1;
  const w=waiver(card,spend,txs.length);
  const fee=w.ok?0:(card.fee||0);
  const k=fx(card.currency);
  return {spend,reward,fee,net:reward-fee,n:txs.length,waived:w.ok&&(card.fee||0)>0,k,spendB:spend*k,rewardB:reward*k,feeB:fee*k,netB:(reward-fee)*k};
}
// 年费减免:年消费满 waiveSpend 元 或 满 waiveCount 笔,任一达成即免
function waiver(card,spend,n){
  const hasS=card.waiveSpend>0,hasN=card.waiveCount>0;
  if(!hasS&&!hasN) return {ok:false,has:false};
  const ok=(hasS&&spend>=card.waiveSpend)||(hasN&&n>=card.waiveCount);
  const parts=[];
  if(hasS)parts.push(`消费 ${money(spend,card.currency)} / ${money(card.waiveSpend,card.currency)}`);
  if(hasN)parts.push(`笔数 ${n} / ${card.waiveCount}`);
  return {ok,has:true,text:parts.join(' 或 ')};
}
function used(card){ // 当前账单周期内已用额度(简化:本月消费)
  const m=today().slice(0,7);
  return db.txs.filter(t=>t.card===card.id&&t.date.startsWith(m)).reduce((s,t)=>s+t.amount,0);
}
function nextDay(day){
  const d=new Date(),y=d.getFullYear(),m=d.getMonth();
  let t=new Date(y,m,Math.min(day,new Date(y,m+1,0).getDate()));
  if(t<new Date(y,m,d.getDate())) t=new Date(y,m+1,Math.min(day,new Date(y,m+2,0).getDate()));
  return {date:t,days:Math.round((t-new Date(y,m,d.getDate()))/864e5)};
}

// 开户奖励:存入 amount 元,持有 days 天,到期获得 reward 元;拿到后提醒转走本金
function offerInfo(o){
  const end=addDays(o.start,o.days);
  if(o.movedDate) return {st:'done',end,label:'已完成',cls:'sub'};
  if(o.rewardedDate) return {st:'move',end,label:'收益已到账,请把这笔钱转走',cls:'bad'};
  const d=diff(end);
  if(d<=0) return {st:'ready',end,label:d===0?'今天满期,等待收益到账':'已满期'+(-d)+'天,请确认收益是否到账',cls:'warn'};
  return {st:'hold',end,d,label:'持有中,还需 '+d+' 天',cls:d<=7?'warn':'sub'};
}
// 年化收益率 = 收益 ÷ 本金 × 365 ÷ 持有天数
const annual=o=>o.amount>0&&o.days>0?o.reward/o.amount*365/o.days*100:0;
function offerAlerts(){
  return db.offers.map(o=>({o,...offerInfo(o)})).filter(x=>x.st==='move'||x.st==='ready'||(x.st==='hold'&&x.d<=7));
}
function offers(){
  const eo=editOffer?db.offers.find(o=>o.id===editOffer):null;
  const list=db.offers.map(o=>({o,...offerInfo(o)})).sort((a,b)=>({move:0,ready:1,hold:2,done:3}[a.st]-({move:0,ready:1,hold:2,done:3}[b.st]))||a.end.localeCompare(b.end));
  return `<div class="box"><b>${eo?'编辑记录':'添加开户 / 开卡奖励'}</b><div class="sub">例如:某券商存入 50000 元,持有 30 天,可得 200 元</div><form id="of" style="margin-top:10px">
    ${eo?'':`<label class="full">套用模板(示例数字,请改成实际活动的要求)<select id="tplo"><option value="">不使用模板</option>${OFFER_TPL.map((t,i)=>`<option value="${i}">${t.n}</option>`).join('')}</select></label>`}
    <label>名称<input name="name" required value="${esc(eo?.name)}" placeholder="如 XX证券新户礼"></label>
    <label>类型<select name="type">${['证券','信用卡','银行','其他'].map(x=>`<option ${eo?.type===x?'selected':''}>${x}</option>`).join('')}</select></label>
    <label>币种<select name="currency">${curOpts(eo?.currency)}</select></label>
    <label>存入金额<input name="amount" type="number" min="0" step="any" required value="${eo?.amount??''}"></label>
    <label>持有天数<input name="days" type="number" min="0" step="1" required value="${eo?.days??''}"></label>
    <label>可得收益<input name="reward" type="number" min="0" step="any" required value="${eo?.reward??''}"></label>
    <label>存入日期<input name="start" type="date" required value="${eo?.start||today()}"></label>
    <label>备注<input name="note" value="${esc(eo?.note)}"></label>
    <div><button class="b">${eo?'保存':'添加'}</button>${eo?' <button type="button" class="b g" id="ocancel">取消</button>':''}</div></form></div>
  ${list.map(({o,st,end,label,cls})=>`<div class="box"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(o.name)} <span class="chip">${esc(o.type)}</span></b><span><button class="e" data-edito="${o.id}">编辑</button><button class="d" data-delo="${o.id}">删除</button></span></div>
    <div class="sub">存入 ${money(o.amount,o.currency)} · 持有 ${o.days} 天(${o.start} → ${end}) · 可得 ${money(o.reward,o.currency)} · 年化 ${annual(o).toFixed(2)}%${o.note?' · '+esc(o.note):''}</div>
    <div class="${cls}" style="margin:6px 0"><b>${label}</b>${o.rewardedDate?`<span class="sub"> · ${o.rewardedDate} 实收 ${money(o.got,o.currency)}</span>`:''}${o.movedDate?`<span class="sub"> · ${o.movedDate} 已转走</span>`:''}</div>
    ${st==='ready'||st==='hold'?`<button class="b" data-got="${o.id}">已拿到收益</button>`:''}
    ${st==='move'?`<button class="b" data-moved="${o.id}">已转走本金</button>`:''}
    </div>`).join('')||'<div class="box empty">暂无记录</div>'}`;
}

// ---------- 图表(内联 SVG,无外部依赖) ----------
const nice=v=>{if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;return (f<=1?1:f<=2?2:f<=5?5:10)*e};
const short=n=>Math.abs(n)>=1e4?(n/1e4).toFixed(1).replace(/\.0$/,'')+'万':String(Math.round(n*100)/100);
function colChart(months,series){ // series:[{name,color,vals[12]}] 堆叠柱
  const W=640,H=250,L=52,R=8,T=10,B=30,pw=W-L-R,ph=H-T-B;
  const tot=months.map((_,i)=>series.reduce((a,s)=>a+s.vals[i],0));
  const max=nice(Math.max(...tot,1)),bw=pw/12*0.6;
  let g='';
  for(let k=0;k<=4;k++){const y=T+ph-ph*k/4;g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${short(max*k/4)}</text>`}
  months.forEach((m,i)=>{const x=L+pw/12*i+(pw/12-bw)/2;let acc=0;
    series.forEach((s,j)=>{const v=s.vals[i];if(v<=0)return;const h=ph*v/max,y=T+ph-ph*acc/max-h;acc+=v;
      g+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="3" fill="${s.color}" stroke="var(--card)" stroke-width="2" data-tip="${m}\n${s.name} ${money(v)}\n当月合计 ${money(tot[i])}"/>`});
    g+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${i+1}</text>`});
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="每月收益堆叠柱状图">${g}</svg>`;
}
function lineChart(labels,series,n){ // series:[{name,color,vals,dash}];只画前 n 个月
  const W=640,H=250,L=52,R=14,T=10,B=30,pw=W-L-R,ph=H-T-B;
  const max=nice(Math.max(1,...series.flatMap(s=>s.vals)));
  const X=i=>L+pw*i/11,Yv=v=>T+ph-ph*v/max;
  let g='';
  for(let k=0;k<=4;k++){const y=T+ph-ph*k/4;g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${short(max*k/4)}</text>`}
  labels.forEach((l,i)=>g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${l}</text>`);
  series.forEach(s=>{const pts=s.vals.slice(0,s.flat?12:n);
    g+=`<polyline fill="none" stroke="${s.color}" stroke-width="2" ${s.dash?'stroke-dasharray="6 4"':''} stroke-linejoin="round" points="${pts.map((v,i)=>X(i)+','+Yv(v)).join(' ')}"/>`;
    if(!s.dash)pts.forEach((v,i)=>g+=`<circle cx="${X(i)}" cy="${Yv(v)}" r="4" fill="${s.color}" stroke="var(--card)" stroke-width="2"/>`)});
  // 悬停热区:每月一条竖带,提示该月所有序列
  for(let i=0;i<n;i++)g+=`<rect x="${X(i)-pw/22}" y="${T}" width="${pw/11}" height="${ph}" fill="transparent" data-tip="${i+1}月\n${series.map(s=>s.name+' '+money(s.vals[i])).join('\n')}"/>`;
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="累计收益折线图">${g}</svg>`;
}
function barChart(rows,fmt,color){ // rows:[{label,val,tip}] 水平条,支持负值;数值固定在右侧列
  if(!rows.length)return '<div class="empty">暂无数据</div>';
  const rh=36,W=640,L=120,R=100,H=rows.length*rh+4,pw=W-L-R-10;
  const mx=Math.max(0,...rows.map(r=>r.val)),mn=Math.min(0,...rows.map(r=>r.val)),span=(mx-mn)||1;
  const z=L+pw*(-mn)/span;
  let g=mn<0?`<line class="grid" x1="${z}" x2="${z}" y1="0" y2="${H}"/>`:'';
  rows.forEach((r,i)=>{const y=i*rh+6,w=Math.abs(r.val)/span*pw,x=r.val>=0?z:z-w,c=r.val<0?'var(--neg)':color;
    g+=`<text x="${L-8}" y="${y+16}" text-anchor="end">${esc(r.label.length>7?r.label.slice(0,6)+'…':r.label)}</text>
    <rect x="${x}" y="${y}" width="${Math.max(w,2)}" height="22" rx="3" fill="${c}" data-tip="${esc(r.tip)}"/>
    <text class="v" x="${W}" y="${y+16}" text-anchor="end">${fmt(r.val)}</text>`});
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

  const bonus=db.offers.filter(o=>o.rewardedDate&&o.rewardedDate.startsWith(String(year))).reduce((s,o)=>s+(o.got??o.reward)*fx(o.currency),0);
  const net=T.reward-T.fee+bonus;
  const al=offerAlerts();
  const multi=db.cards.some(c=>c.currency&&c.currency!=='CNY')||db.offers.some(o=>o.currency&&o.currency!=='CNY');
  const due=db.cards.flatMap(c=>[c.billDay&&{c,k:'账单日',...nextDay(c.billDay)},c.dueDay&&{c,k:'还款日',...nextDay(c.dueDay)}]).filter(Boolean).sort((a,b)=>a.days-b.days).slice(0,6);

  <div class="grid">
    <div class="box stat"><div class="l">总消费${multi?"(折合¥)":""}</div><div class="n">${money(T.spend)}</div></div>
    <div class="box stat"><div class="l">累计收益(返现/积分折算)</div><div class="n good">${money(T.reward)}</div></div>
    <div class="box stat"><div class="l">年费支出</div><div class="n bad">${money(T.fee)}</div></div>
    <div class="box stat"><div class="l">开户奖励(已到账)</div><div class="n good">${money(bonus)}</div></div>
    <div class="box stat"><div class="l">净收益(含开户奖励)</div><div class="n ${net>=0?'good':'bad'}">${money(net)}</div></div>
  </div>
  ${al.length?`<div class="box" style="border-color:var(--warn)"><b>⏰ 开户奖励提醒</b>${al.map(x=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="${x.cls}">${x.st==='move'?'💸 ':''}${esc(x.o.name)}(${money(x.o.amount,x.o.currency)})</span> <span class="sub">${x.label}</span></div>`).join('')}<div style="margin-top:8px"><button class="b g" data-t="offers" id="gooffers">去处理</button></div></div>`:''}
  <div class="box"><b>各卡收益</b><div class="tw"><table><tr><th>卡片</th><th>消费</th><th>收益</th><th>年费</th><th>净收益</th></tr>
  ${rows.map(r=>`<tr><td>${cardDot(r.c)}${esc(r.c.name)} <span class="sub">${esc(r.c.last4)}</span></td><td>${money(r.spend,r.c.currency)}</td><td class="good">${money(r.reward,r.c.currency)}</td><td>${money(r.fee,r.c.currency)}${r.waived?' <span class="chip good">已减免</span>':''}</td><td class="${r.net>=0?'good':'bad'}">${money(r.net,r.c.currency)}</td></tr>`).join('')||'<tr><td colspan=5 class="empty">还没有卡片,先去添加吧</td></tr>'}
  </table></div></div>
  <div id="bk"></div>
  <div class="box"><b>近期账单 / 还款提醒</b>${due.length?due.map(d=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>${esc(d.c.name)} · ${d.k}</span><span class="${d.days<=3?'bad':d.days<=7?'warn':'sub'}">${d.date.getMonth()+1}月${d.date.getDate()}日(${d.days===0?'今天':d.days+'天后'})</span></div>`).join(''):'<div class="empty">暂无,在卡片里填写账单日/还款日即可</div>'}</div>`;
}

function alertTexts(){
  const a=offerAlerts().map(x=>(x.st==='move'?'💸 ':'')+x.o.name+'('+money(x.o.amount,x.o.currency)+'):'+x.label);
  db.cards.forEach(c=>[['账单日',c.billDay],['还款日',c.dueDay]].forEach(([k,d])=>{if(d){const n=nextDay(d);if(n.days<=3)a.push(c.name+' '+k+(n.days===0?'就是今天':'还有'+n.days+'天'))}}));
  return a;
}
// ---- 日历导出(.ics):导入手机日历后由系统在后台准点提醒 ----
function makeIcs(){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//momo cards//CN','CALSCALE:GREGORIAN'];
  const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const dt=s=>s.replace(/-/g,'');
  const ev=(id,date,title,desc,rrule)=>{L.push('BEGIN:VEVENT','UID:'+id+'@momo','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+dt(date),'SUMMARY:'+title,'DESCRIPTION:'+desc);
    if(rrule)L.push('RRULE:'+rrule);
    L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+title,'TRIGGER:PT9H','END:VALARM','END:VEVENT')};
  db.offers.forEach(o=>{if(o.movedDate)return;const end=addDays(o.start,o.days);
    if(!o.rewardedDate)ev('offer-'+o.id,end,o.name+' 满期,确认收益是否到账','存入 '+o.amount+' 元,可得 '+o.reward+' 元。收益到账后请把这笔钱转走。');
    ev('move-'+o.id,addDays(end,1),'【转走本金】'+o.name,'收益到账后请把 '+o.amount+' 元转走。')});
  const t=new Date(),base=ymd(new Date(t.getFullYear(),t.getMonth(),1));
  db.cards.forEach(c=>[['账单日',c.billDay],['还款日',c.dueDay]].forEach(([k,d])=>{if(!d)return;
    const day=Math.min(d,28);ev(k+'-'+c.id,base.slice(0,8)+String(day).padStart(2,'0'),c.name+' '+k,'每月'+d+'号',d>28?'FREQ=MONTHLY;BYMONTHDAY=-1':'FREQ=MONTHLY;BYMONTHDAY='+d)}));
  L.push('END:VCALENDAR');return L.join('\r\n');
}

async function notifyNow(force){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const a=alertTexts();if(!a.length)return;
  const k='momo-notified-'+today();
  try{if(!force&&localStorage.getItem(k)===String(a.length))return;localStorage.setItem(k,String(a.length))}catch(e){}
  const body=a.slice(0,5).join('\n'),title='信用卡管家:'+a.length+' 条待办';
  try{const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();
    if(reg)reg.showNotification(title,{body,icon:'icon.svg',tag:'momo'});else new Notification(title,{body})}catch(e){}
}

// ---------- 导出 .xlsx(无依赖:手写最小 zip + SpreadsheetML) ----------
const CRC=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=-1;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return(c^-1)>>>0};
function zip(files){ // files:[[name,string]] 仅存储不压缩
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];
  files.forEach(([name,str])=>{const nb=enc.encode(name),d=enc.encode(str),c=crc32(d);
    const h=Uint8Array.from([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(d.length),...u32(d.length),...u16(nb.length),...u16(0)]);
    parts.push(h,nb,d);
    cd.push(Uint8Array.from([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(d.length),...u32(d.length),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nb);
    off+=h.length+nb.length+d.length});
  const cdSize=cd.reduce((a,b)=>a+b.length,0);
  const end=Uint8Array.from([0x50,0x4b,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cdSize),...u32(off),...u16(0)]);
  return new Blob([...parts,...cd,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
const xe=v=>String(v).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const colL=i=>{let s='';for(i++;i>0;i=Math.floor((i-1)/26))s=String.fromCharCode(65+(i-1)%26)+s;return s};
function sheetXml(rows){
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols><col min="1" max="30" width="16" customWidth="1"/></cols><sheetData>'+
  rows.map((r,ri)=>`<row r="${ri+1}">`+r.map((v,ci)=>{const ref=colL(ci)+(ri+1),st=ri===0?' s="1"':'';
    if(v===null||v===undefined||v==='')return '';
    return typeof v==='number'&&isFinite(v)?`<c r="${ref}"${st}><v>${Math.round(v*1e6)/1e6}</v></c>`:`<c r="${ref}"${st} t="inlineStr"><is><t xml:space="preserve">${xe(v)}</t></is></c>`}).join('')+'</row>').join('')+'</sheetData></worksheet>';
}
function exportXlsx(){
  const Y=String(year);
  const cardName=id=>(db.cards.find(c=>c.id===id)||{}).name||'(已删除)';
  const monthly=db.cards.map(c=>cardMonthly(c,Y).map(v=>v*fx(c.currency))),bonus=Array(12).fill(0);
  db.offers.forEach(o=>{if(o.rewardedDate&&o.rewardedDate.startsWith(Y))bonus[+o.rewardedDate.slice(5,7)-1]+=(o.got??o.reward)*fx(o.currency)});
  let run=0;
  const sheets=[
   ['卡片',[['名称','币种','尾号','额度','年费','账单日','还款日','基础返还(每100元)','1积分折算(元)','月收益封顶','免年费:年消费','免年费:年笔数','分类加成'],
     ...db.cards.map(c=>[c.name,c.currency||'CNY',c.last4,c.limit,c.fee,c.billDay,c.dueDay,c.base,c.pv,c.cap,c.waiveSpend,c.waiveCount,(c.rules||[]).map(r=>r.cat+' 每100元得'+r.rate).join('; ')])]],
   ['消费记录',[['日期','卡片','币种','类别','金额','收益','备注'],
     ...[...db.txs].sort((a,b)=>a.date.localeCompare(b.date)).map(t=>{const c=db.cards.find(x=>x.id===t.card);return [t.date,cardName(t.card),c?c.currency||'CNY':'',t.cat,t.amount,c?earn(c,t).v*(c.pv??1):0,t.note]})]],
   ['开户奖励',[['名称','类型','币种','本金','持有天数','存入日期','到期日','预计收益','年化收益率%','实收收益','到账日期','转走日期','状态','备注'],
     ...db.offers.map(o=>{const i=offerInfo(o);return [o.name,o.type,o.currency||'CNY',o.amount,o.days,o.start,i.end,o.reward,annual(o),o.got,o.rewardedDate,o.movedDate,i.label,o.note]})]],
   [Y+'月度收益(折合CNY)',[['月份',...db.cards.map(c=>c.name),'开户奖励','合计','累计'],
     ...Array.from({length:12},(_,i)=>{const tot=monthly.reduce((a,m)=>a+m[i],0)+bonus[i];run+=tot;return [(i+1)+'月',...monthly.map(m=>m[i]),bonus[i],tot,run]})]]
  ];
  const X='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const files=[
   ['[Content_Types].xml',X+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')+'</Types>'],
   ['_rels/.rels',X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
   ['xl/workbook.xml',X+'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+sheets.map(([n],i)=>`<sheet name="${xe(n)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')+'</sheets></workbook>'],
   ['xl/_rels/workbook.xml.rels',X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')+`<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
   ['xl/styles.xml',X+'<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'],
   ...sheets.map(([,rows],i)=>[`xl/worksheets/sheet${i+1}.xml`,sheetXml(rows)])
  ];
  const a=document.createElement('a');a.href=URL.createObjectURL(zip(files));a.download='信用卡管家-'+Y+'.xlsx';a.click();
}

// ---------- 服务器备份面板 ----------
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{'X-Token':getTok(),'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!r.ok)throw new Error(r.status);return r.json()}
async function loadBackups(){
  const el=$('#bk');if(!el||!getTok())return;
  try{const list=await api('api/backups');if(!$('#bk'))return;
    $('#bk').innerHTML=`<div class="box"><div style="display:flex;justify-content:space-between;align-items:center"><b>🗄 服务器备份</b><button class="b g" id="bknow">立即备份</button></div>
      <div class="sub">每天自动备份一次,数据变更时每小时最多一份,共保留 ${list.length} 份。恢复前会先把当前数据另存一份。</div>
      ${list.slice(0,8).map(f=>{const m=f.name.match(/db-(\d{4})(\d\d)(\d\d)-(\d\d)(\d\d)(\d\d)/);return `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>${m[1]}-${m[2]}-${m[3]} ${m[4]}:${m[5]}:${m[6]} <span class="sub">${Math.round(f.size/1024*10)/10} KB</span></span><button class="e" data-restore="${f.name}">恢复</button></div>`}).join('')||'<div class="empty">暂无备份</div>'}</div>`;
    $('#bknow').onclick=async()=>{try{const r=await api('api/backup','POST');alert(r.name?'已备份':'数据没有变化,无需备份');loadBackups()}catch(e){alert('备份失败')}};
    document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=async()=>{if(!confirm('用 '+b.dataset.restore+' 覆盖当前数据?当前数据会先另存一份。'))return;
      try{await api('api/restore','POST',{name:b.dataset.restore});db.updatedAt=0;await pullRemote();alert('已恢复');render()}catch(e){alert('恢复失败')}});
  }catch(e){}}

const tip=document.createElement('div');tip.id='tip';document.body.appendChild(tip);
const showTip=e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tip.style.display='none';return}
  tip.textContent=t.dataset.tip;tip.style.display='block';
  const x=Math.min(e.clientX+12,innerWidth-tip.offsetWidth-8),y=Math.max(8,e.clientY-tip.offsetHeight-12);
  tip.style.left=x+'px';tip.style.top=y+'px'};
document.addEventListener('mousemove',showTip);document.addEventListener('click',showTip);
render();
notifyNow();
