<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>信用卡管家</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#2563eb">
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1d2129;--sub:#6b7280;--line:#e5e7eb;--pri:#2563eb;--good:#059669;--bad:#dc2626;--warn:#d97706}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1a1d24;--text:#e6e8ec;--sub:#9aa3b2;--line:#2a2f3a;--pri:#60a5fa;--good:#34d399;--bad:#f87171;--warn:#fbbf24}}
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--neg:#e34948}
@media (prefers-color-scheme:dark){:root{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--neg:#e66767}}
*{box-sizing:border-box}
svg.ch{width:100%;height:auto;display:block;overflow:visible}
svg.ch text{fill:var(--sub);font-size:15px}
svg.ch .v{fill:var(--text)}
svg.ch .grid{stroke:var(--line);stroke-width:1}
svg.ch rect[data-tip]{cursor:pointer}
.leg{display:flex;gap:14px;font-size:13px;margin:4px 0 8px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
#tip{position:fixed;z-index:9;pointer-events:none;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.18);display:none;white-space:pre-line}
details summary{cursor:pointer;color:var(--sub);font-size:13px;margin-top:8px}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
header{padding:16px;display:flex;justify-content:space-between;align-items:center;max-width:960px;margin:0 auto}
h1{font-size:20px;margin:0}
nav{display:flex;gap:4px;max-width:960px;margin:0 auto;padding:0 16px;overflow-x:auto}
nav button{border:0;background:none;color:var(--sub);padding:10px 14px;font-size:15px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:var(--pri);border-color:var(--pri);font-weight:600}
main{max-width:960px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.stat .n{font-size:24px;font-weight:700}.stat .l{color:var(--sub);font-size:13px}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.sub{color:var(--sub);font-size:13px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--sub);font-weight:500}
.tw{overflow-x:auto}
button.b,.b{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer}
button.g,.b.g{background:none;color:var(--pri);border:1px solid var(--line)}
.tw th,.tw td{white-space:nowrap}
header{flex-wrap:wrap;gap:8px}
button.d{background:none;color:var(--bad);border:0;padding:4px 8px;cursor:pointer}
button.e{background:none;color:var(--pri);border:0;padding:4px 8px;cursor:pointer}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
label{display:flex;flex-direction:column;font-size:13px;color:var(--sub);gap:4px}
input,select{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;width:100%}
.full{grid-column:1/-1}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--pri)}
.rule{display:flex;gap:6px;margin-bottom:6px}
.rule input:first-child{flex:2}.rule input:nth-child(2){flex:1}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:12px;margin:2px 4px 2px 0}
.empty{text-align:center;color:var(--sub);padding:24px}
</style>
</head>
<body>
<header><h1>💳 信用卡管家</h1>
<div style="display:flex;flex-wrap:wrap;gap:6px"><button class="b g" id="sync">☁️ 同步</button> <button class="b g" id="bell">🔔 通知</button> <button class="b g" id="ics">📅 日历提醒</button> <button class="b g" id="exp">导出</button><label class="b g" style="cursor:pointer">导入<input type="file" id="imp" accept=".json" hidden></label></div></header>
<nav id="nav"></nav>
<main id="app"></main>

<script>
const KEY='momo-cards-v1';
const CATS=['餐饮','超市','出行','网购','娱乐','话费水电','其他'];
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'¥'+(Math.round(n*100)/100).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>Math.random().toString(36).slice(2,10);
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const pd=s=>new Date(s+'T00:00:00');
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const diff=s=>Math.round((pd(s)-pd(today()))/864e5);

let db;
try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
db=db&&db.cards?db:{cards:[],txs:[]};
db.offers=db.offers||[];
const TOK='momo-token';
const getTok=()=>{try{return localStorage.getItem(TOK)||''}catch(e){return ''}};
const SYNC={off:'☁️ 同步',ok:'☁️ 已同步',auth:'☁️ 令牌错误',err:'☁️ 离线'};
function setSync(k){const b=document.getElementById('sync');if(b)b.textContent=SYNC[k]}
let pushT;
function pushRemote(){const t=getTok();if(!t)return;clearTimeout(pushT);pushT=setTimeout(async()=>{
  try{const r=await fetch('api/data',{method:'PUT',headers:{'X-Token':t,'Content-Type':'application/json'},body:JSON.stringify(db)});
    if(r.status===409){await pullRemote();return}setSync(r.ok?'ok':r.status===401?'auth':'err')}catch(e){setSync('err')}},600)}
const store=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
const save=()=>{db.updatedAt=Date.now();store();pushRemote()};
async function pullRemote(){const t=getTok();if(!t)return setSync('off');
  try{const r=await fetch('api/data',{headers:{'X-Token':t}});if(r.status===401)return setSync('auth');if(!r.ok)return setSync('err');
    const d=await r.json();
    if(d&&Array.isArray(d.cards)&&(d.updatedAt||0)>(db.updatedAt||0)){db=d;db.offers=db.offers||[];store();render()}
    else if((db.updatedAt||0)>(d&&d.updatedAt||0))pushRemote();
    else if(!(d&&d.updatedAt)&&(db.cards.length||db.offers.length||db.txs.length))save();
    setSync('ok')}catch(e){setSync('err')}}

let tab='dash',year=new Date().getFullYear(),editCard=null,editOffer=null;
const TABS=[['dash','总览'],['stats','收益分析'],['cards','我的卡片'],['txs','消费记录'],['offers','开户奖励']];

// 返现/积分:rules=[{cat,rate}],rate 为百分比;base 为默认比例;pv 为每1元积分折算价值(元)
function earn(card,tx){
  const r=(card.rules||[]).find(r=>r.cat===tx.cat);
  const rate=r?r.rate:card.base;
  return {v:tx.amount*rate/100,rate};
}
// 某卡某年各月收益(已含月封顶和积分折算),返回长度 12 的数组
function cardMonthly(card,y){
  const m=Array(12).fill(0);
  db.txs.filter(t=>t.card===card.id&&t.date.startsWith(y)).forEach(t=>{m[+t.date.slice(5,7)-1]+=earn(card,t).v});
  return m.map(v=>(card.cap>0?Math.min(v,card.cap):v)*(card.pv??1));
}
function cardStats(card,y){
  const txs=db.txs.filter(t=>t.card===card.id&&t.date.startsWith(y));
  const spend=txs.reduce((s,t)=>s+t.amount,0);
  let reward=txs.reduce((s,t)=>s+earn(card,t).v,0);
  if(card.cap>0){ // 按月封顶
    const m={};txs.forEach(t=>{const k=t.date.slice(0,7);m[k]=(m[k]||0)+earn(card,t).v});
    reward=Object.values(m).reduce((s,v)=>s+Math.min(v,card.cap),0);
  }
  reward*= card.pv??1;
  const w=waiver(card,spend,txs.length);
  const fee=w.ok?0:(card.fee||0);
  return {spend,reward,fee,net:reward-fee,n:txs.length,waived:w.ok&&(card.fee||0)>0};
}
// 年费减免:年消费满 waiveSpend 元 或 满 waiveCount 笔,任一达成即免
function waiver(card,spend,n){
  const hasS=card.waiveSpend>0,hasN=card.waiveCount>0;
  if(!hasS&&!hasN) return {ok:false,has:false};
  const ok=(hasS&&spend>=card.waiveSpend)||(hasN&&n>=card.waiveCount);
  const parts=[];
  if(hasS)parts.push(`消费 ${money(spend)} / ${money(card.waiveSpend)}`);
  if(hasN)parts.push(`笔数 ${n} / ${card.waiveCount}`);
  return {ok,has:true,text:parts.join(' 或 ')};
}
function used(card){ // 当前账单周期内已用额度(简化:本月消费)
  const m=today().slice(0,7);
  return db.txs.filter(t=>t.card===card.id&&t.date.startsWith(m)).reduce((s,t)=>s+t.amount,0);
}
function nextDay(day){
  const d=new Date(),y=d.getFullYear(),m=d.getMonth();
  let t=new Date(y,m,Math.min(day,new Date(y,m+1,0).getDate()));
  if(t<new Date(y,m,d.getDate())) t=new Date(y,m+1,Math.min(day,new Date(y,m+2,0).getDate()));
  return {date:t,days:Math.round((t-new Date(y,m,d.getDate()))/864e5)};
}

// 开户奖励:存入 amount 元,持有 days 天,到期获得 reward 元;拿到后提醒转走本金
function offerInfo(o){
  const end=addDays(o.start,o.days);
  if(o.movedDate) return {st:'done',end,label:'已完成',cls:'sub'};
  if(o.rewardedDate) return {st:'move',end,label:'收益已到账,请把这笔钱转走',cls:'bad'};
  const d=diff(end);
  if(d<=0) return {st:'ready',end,label:d===0?'今天满期,等待收益到账':'已满期'+(-d)+'天,请确认收益是否到账',cls:'warn'};
  return {st:'hold',end,d,label:'持有中,还需 '+d+' 天',cls:d<=7?'warn':'sub'};
}
// 年化收益率 = 收益 ÷ 本金 × 365 ÷ 持有天数
const annual=o=>o.amount>0&&o.days>0?o.reward/o.amount*365/o.days*100:0;
function offerAlerts(){
  return db.offers.map(o=>({o,...offerInfo(o)})).filter(x=>x.st==='move'||x.st==='ready'||(x.st==='hold'&&x.d<=7));
}
function offers(){
  const eo=editOffer?db.offers.find(o=>o.id===editOffer):null;
  const list=db.offers.map(o=>({o,...offerInfo(o)})).sort((a,b)=>({move:0,ready:1,hold:2,done:3}[a.st]-({move:0,ready:1,hold:2,done:3}[b.st]))||a.end.localeCompare(b.end));
  return `<div class="box"><b>${eo?'编辑记录':'添加开户 / 开卡奖励'}</b><div class="sub">例如:某券商存入 50000 元,持有 30 天,可得 200 元</div><form id="of" style="margin-top:10px">
    <label>名称<input name="name" required value="${esc(eo?.name)}" placeholder="如 XX证券新户礼"></label>
    <label>类型<select name="type">${['证券','信用卡','银行','其他'].map(x=>`<option ${eo?.type===x?'selected':''}>${x}</option>`).join('')}</select></label>
    <label>存入金额(元)<input name="amount" type="number" min="0" step="any" required value="${eo?.amount??''}"></label>
    <label>持有天数<input name="days" type="number" min="0" step="1" required value="${eo?.days??''}"></label>
    <label>可得收益(元)<input name="reward" type="number" min="0" step="any" required value="${eo?.reward??''}"></label>
    <label>存入日期<input name="start" type="date" required value="${eo?.start||today()}"></label>
    <label>备注<input name="note" value="${esc(eo?.note)}"></label>
    <div><button class="b">${eo?'保存':'添加'}</button>${eo?' <button type="button" class="b g" id="ocancel">取消</button>':''}</div></form></div>
  ${list.map(({o,st,end,label,cls})=>`<div class="box"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(o.name)} <span class="chip">${esc(o.type)}</span></b><span><button class="e" data-edito="${o.id}">编辑</button><button class="d" data-delo="${o.id}">删除</button></span></div>
    <div class="sub">存入 ${money(o.amount)} · 持有 ${o.days} 天(${o.start} → ${end}) · 可得 ${money(o.reward)} · 年化 ${annual(o).toFixed(2)}%${o.note?' · '+esc(o.note):''}</div>
    <div class="${cls}" style="margin:6px 0"><b>${label}</b>${o.rewardedDate?`<span class="sub"> · ${o.rewardedDate} 实收 ${money(o.got)}</span>`:''}${o.movedDate?`<span class="sub"> · ${o.movedDate} 已转走</span>`:''}</div>
    ${st==='ready'||st==='hold'?`<button class="b" data-got="${o.id}">已拿到收益</button>`:''}
    ${st==='move'?`<button class="b" data-moved="${o.id}">已转走本金</button>`:''}
    </div>`).join('')||'<div class="box empty">暂无记录</div>'}`;
}

// ---------- 图表(内联 SVG,无外部依赖) ----------
const nice=v=>{if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;return (f<=1?1:f<=2?2:f<=5?5:10)*e};
const short=n=>Math.abs(n)>=1e4?(n/1e4).toFixed(1).replace(/\.0$/,'')+'万':String(Math.round(n*100)/100);
function colChart(months,series){ // series:[{name,color,vals[12]}] 堆叠柱
  const W=640,H=250,L=52,R=8,T=10,B=30,pw=W-L-R,ph=H-T-B;
  const tot=months.map((_,i)=>series.reduce((a,s)=>a+s.vals[i],0));
  const max=nice(Math.max(...tot,1)),bw=pw/12*0.6;
  let g='';
  for(let k=0;k<=4;k++){const y=T+ph-ph*k/4;g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${short(max*k/4)}</text>`}
  months.forEach((m,i)=>{const x=L+pw/12*i+(pw/12-bw)/2;let acc=0;
    series.forEach((s,j)=>{const v=s.vals[i];if(v<=0)return;const h=ph*v/max,y=T+ph-ph*acc/max-h;acc+=v;
      g+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="3" fill="${s.color}" stroke="var(--card)" stroke-width="2" data-tip="${m}\n${s.name} ${money(v)}\n当月合计 ${money(tot[i])}"/>`});
    g+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${i+1}</text>`});
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="每月收益堆叠柱状图">${g}</svg>`;
}
function barChart(rows,fmt,color){ // rows:[{label,val,tip}] 水平条,支持负值;数值固定在右侧列
  if(!rows.length)return '<div class="empty">暂无数据</div>';
  const rh=36,W=640,L=120,R=100,H=rows.length*rh+4,pw=W-L-R-10;
  const mx=Math.max(0,...rows.map(r=>r.val)),mn=Math.min(0,...rows.map(r=>r.val)),span=(mx-mn)||1;
  const z=L+pw*(-mn)/span;
  let g=mn<0?`<line class="grid" x1="${z}" x2="${z}" y1="0" y2="${H}"/>`:'';
  rows.forEach((r,i)=>{const y=i*rh+6,w=Math.abs(r.val)/span*pw,x=r.val>=0?z:z-w,c=r.val<0?'var(--neg)':color;
    g+=`<text x="${L-8}" y="${y+16}" text-anchor="end">${esc(r.label.length>7?r.label.slice(0,6)+'…':r.label)}</text>
    <rect x="${x}" y="${y}" width="${Math.max(w,2)}" height="22" rx="3" fill="${c}" data-tip="${esc(r.tip)}"/>
    <text class="v" x="${W}" y="${y+16}" text-anchor="end">${fmt(r.val)}</text>`});
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function stats(){
  const Y=String(year),ys=[...new Set([year,...db.txs.map(t=>+t.date.slice(0,4))])].sort((a,b)=>b-a);
  const months=Array.from({length:12},(_,i)=>Y+'年'+(i+1)+'月');
  const cardM=Array(12).fill(0),bonusM=Array(12).fill(0);
  db.cards.forEach(c=>cardMonthly(c,Y).forEach((v,i)=>cardM[i]+=v));
  db.offers.forEach(o=>{if(o.rewardedDate&&o.rewardedDate.startsWith(Y))bonusM[+o.rewardedDate.slice(5,7)-1]+=o.got??o.reward});
  const rows=db.cards.map(c=>({c,...cardStats(c,Y)}));
  const spend=rows.reduce((a,r)=>a+r.spend,0),cr=rows.reduce((a,r)=>a+r.reward,0),fee=rows.reduce((a,r)=>a+r.fee,0),bn=bonusM.reduce((a,b)=>a+b,0);
  // 开户奖励资金加权年化:总收益 ÷ Σ(本金×天数) × 365
  const done=db.offers.filter(o=>o.rewardedDate&&o.days>0);
  const cap=done.reduce((a,o)=>a+o.amount*o.days,0),aw=cap?done.reduce((a,o)=>a+(o.got??o.reward),0)/cap*365*100:0;
  const cat={};db.txs.filter(t=>t.date.startsWith(Y)).forEach(t=>cat[t.cat]=(cat[t.cat]||0)+t.amount);
  const catRows=Object.entries(cat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({label:k,val:v,tip:k+'\n'+money(v)+'  占 '+(spend?v/spend*100:0).toFixed(1)+'%'}));
  const netRows=rows.map(r=>({label:r.c.name,val:r.net+0,tip:`${r.c.name}\n收益 ${money(r.reward)}\n年费 ${money(r.fee)}${r.waived?'(已减免)':''}\n净收益 ${money(r.net)}`}));
  const offRows=[...db.offers].sort((a,b)=>annual(b)-annual(a)).map(o=>({label:o.name,val:annual(o),tip:`${o.name}\n本金 ${money(o.amount)} · ${o.days} 天\n收益 ${money(o.reward)}\n年化 ${annual(o).toFixed(2)}%`}));
  return `
  <div class="box"><label style="max-width:140px">年份<select id="yr">${ys.map(y=>`<option ${y===year?'selected':''}>${y}</option>`).join('')}</select></label></div>
  <div class="grid">
    <div class="box stat"><div class="l">综合返现率(收益 ÷ 消费)</div><div class="n">${spend?(cr/spend*100).toFixed(2):'0.00'}%</div></div>
    <div class="box stat"><div class="l">卡片收益 + 开户奖励</div><div class="n good">${money(cr+bn)}</div></div>
    <div class="box stat"><div class="l">开户奖励资金加权年化</div><div class="n">${aw.toFixed(2)}%</div></div>
    <div class="box stat"><div class="l">扣年费后净收益</div><div class="n ${cr+bn-fee>=0?'good':'bad'}">${money(cr+bn-fee)}</div></div>
  </div>
  <div class="box"><b>每月收益</b>
    <div class="leg"><span><i style="background:var(--s1)"></i>消费返现/积分</span><span><i style="background:var(--s2)"></i>开户奖励(按到账月)</span></div>
    ${colChart(months,[{name:'消费返现/积分',color:'var(--s1)',vals:cardM},{name:'开户奖励',color:'var(--s2)',vals:bonusM}])}
    <details><summary>查看数据表</summary><div class="tw"><table><tr><th>月份</th><th>返现/积分</th><th>开户奖励</th><th>合计</th></tr>
    ${cardM.map((v,i)=>`<tr><td>${i+1}月</td><td>${money(v)}</td><td>${money(bonusM[i])}</td><td>${money(v+bonusM[i])}</td></tr>`).join('')}</table></div></details></div>
  <div class="box"><b>各卡净收益(收益 − 年费)</b>${barChart(netRows,v=>money(v),'var(--s1)')}<div class="sub">红色为亏损,即收益不足以覆盖年费。</div></div>
  <div class="box"><b>年费回本分析</b><div class="tw"><table><tr><th>卡片</th><th>年费</th><th>已得收益</th><th>返现率</th><th>回本所需消费</th><th>状态</th></tr>
  ${rows.map(r=>{const rate=r.spend?r.reward/r.spend:0,need=rate>0?r.c.fee/rate:0,ok=r.waived||r.reward>=(r.c.fee||0);
    return `<tr><td>${esc(r.c.name)}</td><td>${money(r.c.fee||0)}</td><td>${money(r.reward)}</td><td>${(rate*100).toFixed(2)}%</td><td>${r.waived||!(r.c.fee>0)?'—':rate>0?money(need):'无消费数据'}</td><td class="${ok?'good':'warn'}">${!(r.c.fee>0)?'无年费':r.waived?'✅ 已减免':ok?'✅ 已回本':'未回本'}</td></tr>`}).join('')||'<tr><td colspan=6 class="empty">暂无</td></tr>'}</table></div></div>
  <div class="box"><b>消费类别占比</b>${barChart(catRows,v=>short(v),'var(--s1)')}</div>
  <div class="box"><b>开户奖励年化收益率</b><div class="sub">年化 = 收益 ÷ 本金 × 365 ÷ 持有天数</div>${barChart(offRows,v=>v.toFixed(2)+'%','var(--s3)')}</div>`;
}

function render(){
  $('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" data-t="${k}">${l}</button>`).join('');
  $('#app').innerHTML=({dash,stats,cards,txs,offers})[tab]();
  bind();
}

function dash(){
  const ys=[...new Set([year,...db.txs.map(t=>+t.date.slice(0,4))])].sort((a,b)=>b-a);
  const rows=db.cards.map(c=>({c,...cardStats(c,String(year))}));
  const T=rows.reduce((a,r)=>({spend:a.spend+r.spend,reward:a.reward+r.reward,fee:a.fee+r.fee}),{spend:0,reward:0,fee:0});
  const bonus=db.offers.filter(o=>o.rewardedDate&&o.rewardedDate.startsWith(String(year))).reduce((s,o)=>s+(o.got??o.reward),0);
  const net=T.reward-T.fee+bonus;
  const al=offerAlerts();
  const due=db.cards.flatMap(c=>[c.billDay&&{c,k:'账单日',...nextDay(c.billDay)},c.dueDay&&{c,k:'还款日',...nextDay(c.dueDay)}]).filter(Boolean).sort((a,b)=>a.days-b.days).slice(0,6);
  return `
  <div class="box"><label style="max-width:140px">年份<select id="yr">${ys.map(y=>`<option ${y===year?'selected':''}>${y}</option>`).join('')}</select></label></div>
  <div class="grid">
    <div class="box stat"><div class="l">总消费</div><div class="n">${money(T.spend)}</div></div>
    <div class="box stat"><div class="l">累计收益(返现/积分折算)</div><div class="n good">${money(T.reward)}</div></div>
    <div class="box stat"><div class="l">年费支出</div><div class="n bad">${money(T.fee)}</div></div>
    <div class="box stat"><div class="l">开户奖励(已到账)</div><div class="n good">${money(bonus)}</div></div>
    <div class="box stat"><div class="l">净收益(含开户奖励)</div><div class="n ${net>=0?'good':'bad'}">${money(net)}</div></div>
  </div>
  ${al.length?`<div class="box" style="border-color:var(--warn)"><b>⏰ 开户奖励提醒</b>${al.map(x=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="${x.cls}">${x.st==='move'?'💸 ':''}${esc(x.o.name)}(${money(x.o.amount)})</span> <span class="sub">${x.label}</span></div>`).join('')}<div style="margin-top:8px"><button class="b g" data-t="offers" id="gooffers">去处理</button></div></div>`:''}
  <div class="box"><b>各卡收益</b><div class="tw"><table><tr><th>卡片</th><th>消费</th><th>收益</th><th>年费</th><th>净收益</th></tr>
  ${rows.map(r=>`<tr><td>${esc(r.c.name)} <span class="sub">${esc(r.c.last4)}</span></td><td>${money(r.spend)}</td><td class="good">${money(r.reward)}</td><td>${money(r.fee)}${r.waived?' <span class="chip good">已减免</span>':''}</td><td class="${r.net>=0?'good':'bad'}">${money(r.net)}</td></tr>`).join('')||'<tr><td colspan=5 class="empty">还没有卡片,先去添加吧</td></tr>'}
  </table></div></div>
  <div class="box"><b>近期账单 / 还款提醒</b>${due.length?due.map(d=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>${esc(d.c.name)} · ${d.k}</span><span class="${d.days<=3?'bad':d.days<=7?'warn':'sub'}">${d.date.getMonth()+1}月${d.date.getDate()}日(${d.days===0?'今天':d.days+'天后'})</span></div>`).join(''):'<div class="empty">暂无,在卡片里填写账单日/还款日即可</div>'}</div>`;
}

function cards(){
  const c=editCard&&editCard!=='new'?db.cards.find(x=>x.id===editCard):{};
  const rules=(c.rules&&c.rules.length?c.rules:[{cat:'',rate:''}]);
  const form=editCard?`<div class="box"><b>${editCard==='new'?'添加卡片':'编辑卡片'}</b><form id="cf" style="margin-top:10px">
    <label>卡片名称<input name="name" required value="${esc(c.name)}" placeholder="如 招行经典白"></label>
    <label>尾号<input name="last4" maxlength="4" value="${esc(c.last4)}"></label>
    <label>额度(元)<input name="limit" type="number" min="0" step="any" value="${c.limit??''}"></label>
    <label>年费(元/年)<input name="fee" type="number" min="0" step="any" value="${c.fee??0}"></label>
    <label>账单日(每月几号)<input name="billDay" type="number" min="1" max="31" value="${c.billDay??''}"></label>
    <label>还款日(每月几号)<input name="dueDay" type="number" min="1" max="31" value="${c.dueDay??''}"></label>
    <label>基础收益率(%)<input name="base" type="number" min="0" step="any" value="${c.base??0}"></label>
    <label>积分折算(1积分=?元,返现填1)<input name="pv" type="number" min="0" step="any" value="${c.pv??1}"></label>
    <label>每月收益封顶(元,0=不封顶)<input name="cap" type="number" min="0" step="any" value="${c.cap??0}"></label>
    <label>免年费:全年消费满(元,0=无)<input name="waiveSpend" type="number" min="0" step="any" value="${c.waiveSpend??0}"></label>
    <label>或 全年刷满(笔,0=无)<input name="waiveCount" type="number" min="0" step="1" value="${c.waiveCount??0}"></label>
    <div class="full"><div class="sub" style="margin-bottom:6px">分类加成(消费类别需与记账时一致,可选:${CATS.join('、')})</div>
      <div id="rules">${rules.map(r=>`<div class="rule"><input list="cats" placeholder="类别" value="${esc(r.cat)}"><input type="number" step="any" min="0" placeholder="收益率%" value="${r.rate}"></div>`).join('')}</div>
      <datalist id="cats">${CATS.map(x=>`<option>${x}`).join('')}</datalist>
      <button type="button" class="b g" id="addrule">+ 加一条</button></div>
    <div class="full"><button class="b">保存</button> <button type="button" class="b g" id="cancel">取消</button></div></form></div>`:'';
  return `${form}<div class="box" style="display:flex;justify-content:space-between;align-items:center"><b>我的卡片(${db.cards.length})</b><button class="b" id="newcard">+ 添加</button></div>
  ${db.cards.map(c=>{const u=used(c),p=c.limit?Math.min(100,u/c.limit*100):0;return `<div class="box"><div style="display:flex;justify-content:space-between"><b>${esc(c.name)} <span class="sub">${esc(c.last4)}</span></b><span><button class="e" data-edit="${c.id}">编辑</button><button class="d" data-delc="${c.id}">删除</button></span></div>
    <div class="sub">年费 ${money(c.fee||0)} · 基础 ${c.base||0}%${c.pv&&c.pv!==1?` · 1积分=${c.pv}元`:''}${c.cap?` · 月封顶 ${money(c.cap)}`:''}${c.billDay?` · 账单日 ${c.billDay}号`:''}${c.dueDay?` · 还款日 ${c.dueDay}号`:''}</div>
    <div>${(c.rules||[]).filter(r=>r.cat).map(r=>`<span class="chip">${esc(r.cat)} ${r.rate}%</span>`).join('')}</div>
    ${(()=>{if(!(c.fee>0))return '';const y=String(new Date().getFullYear()),t=db.txs.filter(t=>t.card===c.id&&t.date.startsWith(y)),w=waiver(c,t.reduce((a,t)=>a+t.amount,0),t.length);
      return w.has?`<div class="${w.ok?'good':'warn'}" style="margin-top:6px">${w.ok?'✅ 今年年费已减免':'⚠️ 免年费进度'}:${w.text}</div>`:''})()}
    ${c.limit?`<div class="sub" style="margin-top:6px">本月已用 ${money(u)} / ${money(c.limit)}</div><div class="bar"><i style="width:${p}%;${p>80?'background:var(--bad)':''}"></i></div>`:''}</div>`}).join('')||'<div class="empty">还没有卡片</div>'}`;
}

function txs(){
  if(!db.cards.length) return '<div class="box empty">请先到「我的卡片」添加一张卡</div>';
  const list=[...db.txs].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,200);
  return `<div class="box"><b>记一笔</b><form id="tf" style="margin-top:10px">
    <label>日期<input name="date" type="date" required value="${today()}"></label>
    <label>卡片<select name="card">${db.cards.map(c=>`<option value="${c.id}">${esc(c.name)} ${esc(c.last4)}</option>`).join('')}</select></label>
    <label>类别<select name="cat">${CATS.map(x=>`<option>${x}`).join('')}</select></label>
    <label>金额(元)<input name="amount" type="number" min="0.01" step="any" required></label>
    <label>备注<input name="note"></label>
    <button class="b">添加</button></form></div>
  <div class="box"><div class="tw"><table><tr><th>日期</th><th>卡片</th><th>类别</th><th>金额</th><th>收益</th><th>备注</th><th></th></tr>
  ${list.map(t=>{const c=db.cards.find(x=>x.id===t.card);if(!c)return '';const e=earn(c,t);return `<tr><td>${t.date}</td><td>${esc(c.name)}</td><td>${esc(t.cat)}</td><td>${money(t.amount)}</td><td class="good">${money(e.v*(c.pv??1))} <span class="sub">${e.rate}%</span></td><td>${esc(t.note)}</td><td><button class="d" data-delt="${t.id}">删</button></td></tr>`}).join('')||'<tr><td colspan=7 class="empty">暂无记录</td></tr>'}
  </table></div><div class="sub">仅显示最近 200 条;月封顶在「总览」中统计。</div></div>`;
}

function bind(){
  $('#yr')&&($('#yr').onchange=e=>{year=+e.target.value;render()});
  $('#newcard')&&($('#newcard').onclick=()=>{editCard='new';render();scrollTo(0,0)});
  $('#cancel')&&($('#cancel').onclick=()=>{editCard=null;render()});
  $('#addrule')&&($('#addrule').onclick=()=>{$('#rules').insertAdjacentHTML('beforeend','<div class="rule"><input list="cats" placeholder="类别"><input type="number" step="any" min="0" placeholder="收益率%"></div>')});
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editCard=b.dataset.edit;render();scrollTo(0,0)});
  document.querySelectorAll('[data-delc]').forEach(b=>b.onclick=()=>{if(confirm('删除该卡片及其全部消费记录?')){const id=b.dataset.delc;db.cards=db.cards.filter(c=>c.id!==id);db.txs=db.txs.filter(t=>t.card!==id);save();render()}});
  document.querySelectorAll('[data-delt]').forEach(b=>b.onclick=()=>{db.txs=db.txs.filter(t=>t.id!==b.dataset.delt);save();render()});
  $('#gooffers')&&($('#gooffers').onclick=()=>{tab='offers';render()});
  document.querySelectorAll('[data-delo]').forEach(b=>b.onclick=()=>{if(confirm('删除这条记录?')){db.offers=db.offers.filter(o=>o.id!==b.dataset.delo);save();render()}});
  document.querySelectorAll('[data-got]').forEach(b=>b.onclick=()=>{const o=db.offers.find(o=>o.id===b.dataset.got);const v=prompt('实际收到的收益(元)',o.reward);if(v===null)return;const n=parseFloat(v);if(isNaN(n)||n<0)return alert('请输入有效金额');o.got=n;o.rewardedDate=today();save();render()});
  document.querySelectorAll('[data-moved]').forEach(b=>b.onclick=()=>{db.offers.find(o=>o.id===b.dataset.moved).movedDate=today();save();render()});
  const of=$('#of');
  if(of)of.onsubmit=e=>{e.preventDefault();const f=new FormData(of);
    const o={name:f.get('name').trim(),type:f.get('type'),amount:+f.get('amount'),days:parseInt(f.get('days')),reward:+f.get('reward'),start:f.get('start'),note:f.get('note').trim()};
    if(editOffer)Object.assign(db.offers.find(x=>x.id===editOffer),o);else db.offers.push({id:uid(),...o});
    editOffer=null;save();render()};
  $('#ocancel')&&($('#ocancel').onclick=()=>{editOffer=null;render()});
  document.querySelectorAll('[data-edito]').forEach(b=>b.onclick=()=>{editOffer=b.dataset.edito;render();scrollTo(0,0)});
  const cf=$('#cf');
  if(cf)cf.onsubmit=e=>{e.preventDefault();const f=new FormData(cf),n=k=>+f.get(k)||0;
    const rules=[...cf.querySelectorAll('.rule')].map(r=>{const i=r.querySelectorAll('input');return{cat:i[0].value.trim(),rate:+i[1].value||0}}).filter(r=>r.cat);
    const o={name:f.get('name').trim(),last4:f.get('last4').trim(),limit:n('limit'),fee:n('fee'),billDay:n('billDay')||'',dueDay:n('dueDay')||'',base:n('base'),pv:f.get('pv')===''?1:n('pv'),cap:n('cap'),waiveSpend:n('waiveSpend'),waiveCount:parseInt(f.get('waiveCount'))||0,rules};
    if(editCard==='new')db.cards.push({id:uid(),...o});else Object.assign(db.cards.find(c=>c.id===editCard),o);
    editCard=null;save();render()};
  const tf=$('#tf');
  if(tf)tf.onsubmit=e=>{e.preventDefault();const f=new FormData(tf);
    db.txs.push({id:uid(),date:f.get('date'),card:f.get('card'),cat:f.get('cat'),amount:+f.get('amount'),note:f.get('note').trim()});
    save();render()};
}
$('#nav').onclick=e=>{const t=e.target.dataset.t;if(t){tab=t;editCard=null;editOffer=null;render()}};
$('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='cards-backup-'+today()+'.json';a.click()};
$('#imp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.cards)||!Array.isArray(d.txs))throw 0;if(confirm('导入将覆盖当前数据,继续?')){db=d;db.offers=db.offers||[];save();render()}}catch{alert('文件格式不正确')}e.target.value=''};

// ---- 提醒文本 ----
function alertTexts(){
  const a=offerAlerts().map(x=>(x.st==='move'?'💸 ':'')+x.o.name+'('+money(x.o.amount)+'):'+x.label);
  db.cards.forEach(c=>[['账单日',c.billDay],['还款日',c.dueDay]].forEach(([k,d])=>{if(d){const n=nextDay(d);if(n.days<=3)a.push(c.name+' '+k+(n.days===0?'就是今天':'还有'+n.days+'天'))}}));
  return a;
}
// ---- 日历导出(.ics):导入手机日历后由系统在后台准点提醒 ----
function makeIcs(){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//momo cards//CN','CALSCALE:GREGORIAN'];
  const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const dt=s=>s.replace(/-/g,'');
  const ev=(id,date,title,desc,rrule)=>{L.push('BEGIN:VEVENT','UID:'+id+'@momo','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+dt(date),'SUMMARY:'+title,'DESCRIPTION:'+desc);
    if(rrule)L.push('RRULE:'+rrule);
    L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+title,'TRIGGER:PT9H','END:VALARM','END:VEVENT')};
  db.offers.forEach(o=>{if(o.movedDate)return;const end=addDays(o.start,o.days);
    if(!o.rewardedDate)ev('offer-'+o.id,end,o.name+' 满期,确认收益是否到账','存入 '+o.amount+' 元,可得 '+o.reward+' 元。收益到账后请把这笔钱转走。');
    ev('move-'+o.id,addDays(end,1),'【转走本金】'+o.name,'收益到账后请把 '+o.amount+' 元转走。')});
  const t=new Date(),base=ymd(new Date(t.getFullYear(),t.getMonth(),1));
  db.cards.forEach(c=>[['账单日',c.billDay],['还款日',c.dueDay]].forEach(([k,d])=>{if(!d)return;
    const day=Math.min(d,28);ev(k+'-'+c.id,base.slice(0,8)+String(day).padStart(2,'0'),c.name+' '+k,'每月'+d+'号',d>28?'FREQ=MONTHLY;BYMONTHDAY=-1':'FREQ=MONTHLY;BYMONTHDAY='+d)}));
  L.push('END:VCALENDAR');return L.join('\r\n');
}
$('#ics').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([makeIcs()],{type:'text/calendar'}));a.download='momo-reminders.ics';a.click();alert('已下载日历文件。用手机打开它(或导入到系统日历)后,系统会在每个到期日早上 9 点准时提醒你。更改记录后需要重新导出。')};
// ---- 浏览器通知:打开页面时推送一次/天 ----
async function notifyNow(force){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const a=alertTexts();if(!a.length)return;
  const k='momo-notified-'+today();
  try{if(!force&&localStorage.getItem(k)===String(a.length))return;localStorage.setItem(k,String(a.length))}catch(e){}
  const body=a.slice(0,5).join('\n'),title='信用卡管家:'+a.length+' 条待办';
  try{const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();
    if(reg)reg.showNotification(title,{body,icon:'icon.svg',tag:'momo'});else new Notification(title,{body})}catch(e){}
}
$('#bell').onclick=async()=>{
  if(!('Notification' in window))return alert('当前浏览器不支持通知,请使用「日历提醒」。');
  const r=Notification.permission==='granted'?'granted':await Notification.requestPermission();
  if(r!=='granted')return alert('未授权通知。');
  if(!alertTexts().length)alert('通知已开启。目前没有待办,有到期事项时打开本页会提醒你。注意:网页通知只在页面被打开时触发,想要准点后台提醒请用「日历提醒」。');
  notifyNow(true);
};
$('#sync').onclick=async()=>{
  const cur=getTok();const t=prompt('输入服务器访问令牌(MOMO_TOKEN)。留空则关闭同步。',cur);if(t===null)return;
  try{if(t.trim())localStorage.setItem(TOK,t.trim());else localStorage.removeItem(TOK)}catch(e){}
  await pullRemote()};
pullRemote();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
const tip=document.createElement('div');tip.id='tip';document.body.appendChild(tip);
const showTip=e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tip.style.display='none';return}
  tip.textContent=t.dataset.tip;tip.style.display='block';
  const x=Math.min(e.clientX+12,innerWidth-tip.offsetWidth-8),y=Math.max(8,e.clientY-tip.offsetHeight-12);
  tip.style.left=x+'px';tip.style.top=y+'px'};
document.addEventListener('mousemove',showTip);document.addEventListener('click',showTip);
render();
notifyNow();
</script>
</body>
